name: Build PlutoForChannels Linux Daemon

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v6

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Publish Executable
      run: dotnet publish -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: PlutoForChannels-Linux-x64
        path: bin/Release/net10.0/linux-x64/publish/PlutoForChannels
